name: Code quality and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Temporary compatibility step while the committed lockfile is being repaired.
      # Keep the subsequent npm ci strict; do not use npm install as a substitute.
      - name: Reconcile lockfile for CI runner
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo '::warning::Committed package-lock.json is stale. Commit a regenerated lockfile to restore reproducible CI.'
          fi
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --reporter=default
      - name: Production build
        run: npm run build
